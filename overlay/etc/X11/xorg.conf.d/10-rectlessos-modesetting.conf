# Старые драйверы X (xserver-xorg-video-intel/ati/nouveau) на Ubuntu 24.04 на части ПК
# роняют X-сервер в момент входа. Универсальный modesetting работает со всеми KMS-видеокартами.
Section "OutputClass"
    Identifier "RectlessOS modesetting"
    MatchDriver "i915|amdgpu|radeon|nouveau"
    Driver "modesetting"
EndSection
