[greeter]
background=/usr/share/backgrounds/rectlessos.png
user-background=false
theme-name=Rectless-dark
icon-theme-name=Papirus-Dark
cursor-theme-name=DMZ-Black
cursor-theme-size=20
font-name=Noto Sans 11
default-user-image=/usr/share/pixmaps/rectlessos-logo.png
clock-format=%a %d %b  %H:%M
indicators=~host;~spacer;~clock;~session;~power
position=50%,center
panel-position=top
