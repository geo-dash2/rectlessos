[Seat:*]
greeter-session=lightdm-gtk-greeter
# сеанс называем явно: и для автовхода, и для ручного входа через экран входа
user-session=xfce
autologin-user=user
autologin-user-timeout=0
autologin-session=xfce
allow-guest=false
# охранник сеанса: если рабочий стол умирает за секунды после входа (чёрный экран и возврат
# на экран входа), он сам включает более щадящий графический режим и собирает журналы
session-setup-script=/usr/local/sbin/rectlessos-session-start
session-cleanup-script=/usr/local/sbin/rectlessos-session-stop
