# --- zram: своп в памяти дешёвый, поэтому охотно им пользуемся (рекомендации для zram) ---
vm.swappiness = 150
vm.page-cluster = 0
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125

# --- запись на USB-флешку: не копим гигабайты «грязных» страниц ---
# По умолчанию система накапливает до 20% памяти (на 16 ГБ это ~3 ГБ), а потом сбрасывает
# разом на медленную флешку, и всё подвисает. Сбрасываем рано и маленькими порциями.
vm.dirty_background_bytes = 16777216
vm.dirty_bytes = 67108864
vm.dirty_expire_centisecs = 1500
vm.dirty_writeback_centisecs = 300
vm.vfs_cache_pressure = 50
