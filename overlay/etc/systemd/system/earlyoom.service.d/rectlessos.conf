# earlyoom убивает самый «жирный» процесс раньше, чем система зависнет из-за нехватки памяти.
# Срабатывает при <5% свободной памяти И <5% свободного zram/swap.
# Рабочий стол и службы под защитой; в первую очередь жертвой станет браузер.
[Service]
ExecStart=
ExecStart=/usr/bin/earlyoom -r 3600 -m 5 -s 5 --avoid "(^|/)(Xorg|xfwm4|xfce4-session|xfce4-panel|xfdesktop|lightdm|systemd|systemd-logind|pipewire|wireplumber|dbus-daemon|NetworkManager)$$" --prefer "(^|/)(firefox|firefox-bin|Isolated Web Co|WebKitWebProces|epiphany|chrome|chromium)$$"
Nice=-20
OOMScoreAdjust=-1000
